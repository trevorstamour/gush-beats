<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gush Beats | Instrumentals & Rap Beats</title>
  <meta name="description" content="Dark, cinematic rap beats and instrumentals by Gush Beats. Listen on SoundCloud, follow on Instagram, or get in touch for beats." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #24242e 0%, #101014 42%, #050506 100%);
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .page {
      width: 100%;
      max-width: 980px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(18px);
    }

    .hero {
      padding: 58px 34px 34px;
      text-align: center;
    }

    .eyebrow {
      color: #a9a9b8;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin-bottom: 18px;
    }

    .tagline {
      color: #d7d7df;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.45;
      max-width: 680px;
      margin: 0 auto 32px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 38px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .button.primary {
      background: linear-gradient(135deg, #ff5f35, #ff2f72);
      border: none;
    }

    .player-wrap {
      padding: 0 24px 34px;
    }

    .player-card {
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 22px;
      padding: 16px;
    }

    iframe {
      width: 100%;
      height: 450px;
      border: 0;
      border-radius: 16px;
      display: block;
    }

    .footer {
      padding: 22px 28px 30px;
      color: #8d8d99;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .hero {
        padding: 46px 22px 26px;
      }

      .player-wrap {
        padding: 0 14px 24px;
      }

      iframe {
        height: 390px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">Rap Beats • Instrumentals • SoundCloud</p>
      <h1>Gush Beats</h1>
      <p class="tagline">Dark-mode instrumentals, rap beats, and soundscapes. Stream the latest playlist below and reach out for beat inquiries.</p>

      <div class="buttons">
        <a class="button primary" href="https://soundcloud.com/gush-beats" target="_blank" rel="noopener noreferrer">Listen on SoundCloud</a>
        <a class="button" href="https://instagram.com/gush" target="_blank" rel="noopener noreferrer">Instagram @gush</a>
        <a class="button" href="mailto:gush@gushbeats.com">Email Gush</a>
      </div>
    </section>

    <section class="player-wrap" aria-label="SoundCloud playlist player">
      <div class="player-card">
        <iframe
          title="Gush Beats SoundCloud Playlist"
          scrolling="no"
          allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/gush-beats/sets/optics-0-5&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
        </iframe>
      </div>
    </section>

    <footer class="footer">
      © <span id="year"></span> Gush Beats. All rights reserved.
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
